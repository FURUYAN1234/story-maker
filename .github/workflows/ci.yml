name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: story-maker
    steps:
      - uses: actions/checkout@v4
        with:
          path: story-maker
      - name: Check out the current manga contract
        uses: actions/checkout@v4
        with:
          repository: FURUYAN1234/nano-banana-pro
          ref: main
          path: nano-banana-pro
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            story-maker/package-lock.json
            nano-banana-pro/package-lock.json
      - name: Install manga parser dependencies
        run: npm ci
        working-directory: nano-banana-pro
      - run: npm ci
      - run: npm run build
      - name: Run unit tests
        run: npm test
